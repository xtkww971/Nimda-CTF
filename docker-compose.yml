services:
  ctf-redis:
    image: redis:7-alpine
    container_name: ctf-redis
    mem_limit: 100m
    command: >
      redis-server
      --maxmemory 80mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ctf-internal

 
  # 특권 프로세스. ctf:agent:ops를 읽어 문제 컨테이너를 빌드/실행하고
  # ctf:agent:results로 결과를 돌려준다. uuid -> 컨테이너 기록도 같은 redis에 남긴다.
  agent:
    container_name: ctf-agent
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      - CTF_BUILD_WORK_DIR=/var/lib/ctf/build
      # 생성된 인스턴스를 어느 주소로 안내할지. 로컬에선 호스트 루프백.
      - CTF_INSTANCE_HOST=127.0.0.1
      # web(HTTP) 인스턴스를 붙일 네트워크. 프록시가 같은 네트워크에서 컨테이너 이름으로 붙는다(#35).
      - CTF_INSTANCE_NETWORK=ctf-instances
      - CTF_AGENT_REDIS_ADDR=ctf-redis:6379
      - CTF_QUEUE_AGENT_STREAM_KEY=ctf:agent:ops
      - CTF_QUEUE_AGENT_CONSUMER_GROUP=ctf-agents
      - CTF_QUEUE_AGENT_RESULT_STREAM_KEY=ctf:agent:results
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Provisioner가 S3에서 문제 데이터를 받아와 압축을 푸는 위치
      - ctf-build:/var/lib/ctf/build
    depends_on:
      ctf-redis:
        condition: service_healthy
    networks:
      - ctf-internal

  provisioner:
    container_name: ctf-provisioner
    build:
      context: .
      dockerfile: provisioner/Dockerfile
    env_file:
      - provisioner/.env
    environment:
      - REDIS_ADDR=nimda-redis:6379
      - CTF_AGENT_REDIS_ADDR=ctf-redis:6379
      - CTF_BUILD_WORK_DIR=/var/lib/ctf/build
   
    volumes:
      - ctf-build:/var/lib/ctf/build
    depends_on:
      ctf-redis:
        condition: service_healthy
    # 웹사이트와도 통신하고 내부 redis도 사용
    networks:
      - ctf-internal
      - nimda-network

  # 인스턴스 모니터링 화면 (Feature-01). agent가 쓴 monitor:snapshot을 읽어 보여주기만 한다.
  # nimda-network에 붙이지 않는다. 웹이 뚫려도 대시보드에는 닿지 않게 하기 위해서다.
  # 호스트의 127.0.0.1에만 열고, 서버에서는 SSH 터널로 접근한다.
  #   ssh -L 6070:127.0.0.1:6070 사용자@서버주소  →  브라우저에서 http://localhost:6070
  dashboard:
    container_name: ctf-dashboard
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      - CTF_DASHBOARD_ADDR=:6070
      - CTF_DASHBOARD_REDIS_ADDR=ctf-redis:6379
    ports:
      - "127.0.0.1:6070:6070"
    depends_on:
      ctf-redis:
        condition: service_healthy
    networks:
      - ctf-internal

volumes:
  ctf-build:

networks:
  # ctf 서버 내부 컨테이너 네트워크
  ctf-internal:

  # 웹사이트 컨테이너 네트워크
  nimda-network:
    external: true

  # pwn(TCP) 문제 인스턴스 전용 네트워크 (ADR-0020).
  # agent가 도커 소켓으로 만든 문제 컨테이너를 CTF_PWN_NETWORK 이름으로 여기에 붙인다.
  # compose 서비스 중 아무도 이 네트워크를 안 쓰므로(agent는 소켓으로 직접 만든다) compose가
  # 만들어 주지 않는다. 그래서 enable_icc=false 같은 옵션과 함께 docker network create로
  # 미리 만들고(docs/runbook), 여기서는 external로 "밖에서 만든다"만 표시한다.
  ctf-pwn:
    external: true

  # web(HTTP) 문제 인스턴스 전용 네트워크 (ADR-0017, #35).
  # agent가 도커 소켓으로 만든 web 컨테이너를 CTF_INSTANCE_NETWORK 이름으로 여기에 붙인다.
  # internal로 만들어 인스턴스가 인터넷으로 못 나가게 하고(reverse shell 차단), host 포트를
  # 안 연다. 프록시(웹 백엔드)가 같은 네트워크에서 컨테이너 이름으로 붙는다.
  # ctf-pwn과 같이 compose 서비스가 안 쓰므로 docker network create로 미리 만들고(docs/runbook)
  # 여기서는 external로 "밖에서 만든다"만 표시한다.
  ctf-instances:
    external: true
