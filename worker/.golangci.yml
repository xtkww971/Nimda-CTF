# golangci-lint config for the judge worker.
# Install: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
# Run:     golangci-lint run ./...   (from worker/)
#
# gosec is enabled deliberately: this worker will soon execute untrusted
# user code (os/exec, syscall), so catching unsafe patterns (command
# injection, unchecked file permissions, etc.) at lint time matters more
# here than in a typical CRUD service.
version: "2"

linters:
  enable:
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    - misspell
    - gosec

  settings:
    gosec:
      excludes:
        - G104 # errcheck already covers unhandled errors; avoid duplicate noise

run:
  timeout: 3m