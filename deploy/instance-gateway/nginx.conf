# web 인스턴스 포워딩 게이트웨이 (ADR-0023).
#
# 웹 backend(Lightsail)는 다른 호스트라 ctf-instances 망의 alias(i-{uuid}, s-{code})를 못 푼다.
# backend가 소유권을 확인한 뒤 VPC peering으로 여기(EC2 사설 IP:8088)에 보내고,
# 대상은 X-Ctf-Target: <alias>:<port> 헤더로 넘긴다. 게이트웨이는 판정하지 않고 형식만 검사해 넘긴다.
#
# 이 포트는 EC2 사설 IP에만 바인딩하고, 보안 그룹은 Lightsail 사설 IP만 허용한다(RB-0003).

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # 도커 embedded DNS. ctf-instances 망의 alias를 푼다. 인스턴스가 재생성되면 IP가 바뀌므로 짧게 캐시한다.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # 대상은 agent가 붙이는 alias 형식만 받는다(runtime.AliasPerUserPrefix/AliasSharedPrefix).
    #   i-{uuid}:{port} / s-{code}:{port}
    # 점(.)을 막는 이유: embedded DNS는 모르는 이름을 바깥 DNS로 넘긴다. 점을 허용하면
    # "s-x.example.com:80" 같은 값으로 게이트웨이가 바깥이나 다른 망으로 요청을 보낼 수 있다.
    map $http_x_ctf_target $ctf_target {
        default "";
        "~^[is]-[A-Za-z0-9][A-Za-z0-9_-]{0,60}:[1-9][0-9]{0,4}$" $http_x_ctf_target;
    }

    # 웹 nginx(client_max_body_size 10m)와 맞춘다.
    client_max_body_size 10m;

    log_format gw '$remote_addr [$time_local] "$request" $status target=$ctf_target '
                  'upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout gw;
    error_log /dev/stderr warn;

    server {
        listen 8088;

        location / {
            if ($ctf_target = "") {
                return 400 "invalid X-Ctf-Target\n";
            }

            proxy_pass http://$ctf_target;
            proxy_http_version 1.1;
            # 같은 호스트에서 이름으로 붙던 때(ADR-0017 2-2)와 같게, 문제 컨테이너는 Host로 alias:port를 본다.
            proxy_set_header Host $ctf_target;
            proxy_set_header X-Ctf-Target "";
            proxy_set_header Connection "";
            # Location은 문제가 준 그대로 backend로 돌려준다. backend가 브라우저에 그대로 넘긴다.
            proxy_redirect off;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
