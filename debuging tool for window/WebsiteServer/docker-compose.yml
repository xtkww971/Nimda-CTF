services:
  redis-queue:
    image: redis:alpine
    container_name: nimda-redis-dev
    ports:
      - "6379:6379"
    networks:
      - nimda-network

  backend:
    build:
      context: ${BACKEND_PATH}
      dockerfile: Dockerfile
    container_name: nimda-backend-dev
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - SPRING_REDIS_HOST=redis-queue
      - SPRING_REDIS_PORT=6379
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_SECURITY_USER_NAME=${SPRING_SECURITY_USER_NAME}
      - SPRING_SECURITY_USER_PASSWORD=${SPRING_SECURITY_USER_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis-queue
    networks:
      - nimda-network

networks:
  nimda-network:
    name: nimda-network
    driver: bridge