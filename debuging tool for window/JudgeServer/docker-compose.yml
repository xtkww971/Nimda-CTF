services:
  judge-server:
    build:
      context: ${JUDGE_PATH}
      dockerfile: Dockerfile
    container_name: nimda-judge-dev
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=nimda-redis-dev
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - nimda-network

networks:
  nimda-network:
    external: true # 사용중인 네트워크를 외부에서 연결할 수 있도록 설정